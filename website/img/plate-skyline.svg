<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A city skyline with rising value">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1a30"/><stop offset="0.7" stop-color="#16314f"/><stop offset="1" stop-color="#5e5a52"/></linearGradient>
    <linearGradient id="win2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2D78C"/><stop offset="1" stop-color="#C99B45"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky2)"/>
  <!-- back towers -->
  <g fill="#122745" opacity="0.6">
    <rect x="60" y="240" width="70" height="360"/><rect x="160" y="300" width="60" height="300"/><rect x="600" y="270" width="70" height="330"/><rect x="690" y="320" width="60" height="280"/>
  </g>
  <!-- front towers -->
  <g fill="#0c1d34">
    <rect x="120" y="320" width="90" height="280"/><rect x="240" y="220" width="100" height="380"/><rect x="370" y="290" width="90" height="310"/><rect x="490" y="180" width="110" height="420"/>
  </g>
  <!-- window grid -->
  <g fill="url(#win2)" opacity="0.85">
    <rect x="262" y="250" width="12" height="16"/><rect x="284" y="250" width="12" height="16" opacity="0.5"/><rect x="306" y="250" width="12" height="16"/>
    <rect x="262" y="290" width="12" height="16" opacity="0.6"/><rect x="306" y="290" width="12" height="16"/>
    <rect x="514" y="220" width="12" height="16"/><rect x="540" y="220" width="12" height="16" opacity="0.5"/><rect x="566" y="220" width="12" height="16"/>
    <rect x="514" y="262" width="12" height="16"/><rect x="540" y="262" width="12" height="16"/><rect x="566" y="262" width="12" height="16" opacity="0.6"/>
    <rect x="140" y="360" width="12" height="16" opacity="0.6"/><rect x="166" y="360" width="12" height="16"/>
    <rect x="392" y="330" width="12" height="16"/><rect x="418" y="330" width="12" height="16" opacity="0.5"/>
  </g>
  <!-- ascending value line -->
  <polyline points="60,500 200,440 340,460 480,360 620,300 740,210" fill="none" stroke="#C99B45" stroke-width="2.4"/>
  <circle cx="740" cy="210" r="6" fill="#E9C879"/>
  <circle cx="480" cy="360" r="4.5" fill="#E9C879" opacity="0.8"/>
  <rect x="0" y="600" width="800" height="2" fill="#C99B45" opacity="0.4"/>
</svg>
