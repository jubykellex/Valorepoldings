<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A warm, well-kept interior">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13294a"/><stop offset="1" stop-color="#0c1d34"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9C879" stop-opacity="0.55"/><stop offset="1" stop-color="#E9C879" stop-opacity="0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a587f"/><stop offset="1" stop-color="#1d3a5e"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wall)"/>
  <!-- floor -->
  <rect x="0" y="430" width="800" height="170" fill="#0a1830"/>
  <!-- light pool from window -->
  <polygon points="470,120 690,120 760,540 380,540" fill="url(#light)"/>
  <!-- window -->
  <g>
    <rect x="470" y="120" width="220" height="250" rx="3" fill="url(#glass)" stroke="#C99B45" stroke-width="2"/>
    <line x1="580" y1="120" x2="580" y2="370" stroke="#C99B45" stroke-width="2" opacity="0.8"/>
    <line x1="470" y1="245" x2="690" y2="245" stroke="#C99B45" stroke-width="2" opacity="0.8"/>
  </g>
  <!-- armchair silhouette -->
  <g fill="#091a2e">
    <path d="M120 540 v-120 a40 40 0 0 1 40 -40 h80 a40 40 0 0 1 40 40 v120 Z"/>
    <rect x="110" y="450" width="30" height="90" rx="8"/><rect x="260" y="450" width="30" height="90" rx="8"/>
  </g>
  <g fill="none" stroke="#C99B45" stroke-width="1.4" opacity="0.5"><path d="M150 420 q60 -34 120 0"/></g>
  <!-- side table + lamp glow -->
  <rect x="330" y="470" width="14" height="70" fill="#091a2e"/>
  <circle cx="337" cy="455" r="16" fill="#E9C879" opacity="0.7"/>
  <!-- floor line -->
  <rect x="0" y="430" width="800" height="2" fill="#C99B45" opacity="0.35"/>
</svg>
