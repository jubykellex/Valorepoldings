<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Founder portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15314f"/><stop offset="1" stop-color="#0b1a30"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C99B45" stop-opacity="0"/><stop offset="1" stop-color="#E9C879" stop-opacity="0.5"/></linearGradient>
  </defs>
  <rect width="480" height="600" fill="url(#bg)"/>
  <!-- rim light -->
  <rect x="300" y="0" width="180" height="600" fill="url(#rim)"/>
  <!-- figure silhouette -->
  <g fill="#0a1830">
    <ellipse cx="240" cy="210" rx="86" ry="98"/>
    <path d="M70 600 q0 -190 170 -190 q170 0 170 190 Z"/>
  </g>
  <!-- rim highlight on figure edge -->
  <g fill="none" stroke="#E9C879" stroke-width="2" opacity="0.45">
    <path d="M318 150 q34 60 14 150"/>
    <path d="M360 470 q4 -110 -40 -170"/>
  </g>
  <!-- crest accent -->
  <path d="M240 70 l11 11 l-11 11 l-11 -11 z" fill="#C99B45" opacity="0.85"/>
</svg>
